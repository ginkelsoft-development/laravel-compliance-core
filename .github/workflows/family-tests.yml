name: Family tests

# Herbruikbare workflow voor de GinkelSoft compliance-familie.
#
# Bevat de gedeelde PHP/Laravel-testmatrix en de drie CI-jobs (test,
# static-analysis, code-style) zodat elk familiepakket (laravel-compliance-core
# en de zes leden die er bovenop bouwen) dezelfde matrix draait zonder hem
# elders te dupliceren. Consumers roepen dit aan via:
#
#   jobs:
#     tests:
#       uses: ginkelsoft-development/laravel-compliance-core/.github/workflows/family-tests.yml@development
#
# Wijzig de matrix hier; consumers hoeven niets aan te passen.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            laravel: 10.*
            testbench: ^8.0
          - php: 8.3
            laravel: 10.*
            testbench: ^8.0

          - php: 8.2
            laravel: 11.*
            testbench: ^9.0
          - php: 8.3
            laravel: 11.*
            testbench: ^9.0
          - php: 8.4
            laravel: 11.*
            testbench: ^9.0

          - php: 8.3
            laravel: 12.*
            testbench: ^10.0
          - php: 8.4
            laravel: 12.*
            testbench: ^10.0
          - php: 8.5
            laravel: 12.*
            testbench: ^10.0

          - php: 8.3
            laravel: 13.*
            testbench: ^11.0
          - php: 8.4
            laravel: 13.*
            testbench: ^11.0
          - php: 8.5
            laravel: 13.*
            testbench: ^11.0

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, bcmath
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" \
                          "illuminate/database:${{ matrix.laravel }}" \
                          "illuminate/console:${{ matrix.laravel }}" \
                          "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --colors=always

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan (max level)

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  code-style:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test
