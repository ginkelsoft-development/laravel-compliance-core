name: Tests

# Dunne wrapper rond de herbruikbare family-tests.yml workflow. De matrix
# (PHP x Laravel) en de jobs (test, static-analysis, code-style) worden
# voortaan onderhouden in .github/workflows/family-tests.yml — zie ook
# CONTRIBUTING.md.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/family-tests.yml
